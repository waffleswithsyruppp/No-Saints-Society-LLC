<!doctype html>

<html lang="en">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="description"
    content="NO SAINTS SOCIETY. Current collection and Fallen Angel Collections."
  >

  <meta
    name="theme-color"
    content="#ffffff"
  >

  <title>
    NO SAINTS SOCIETY
  </title>

  <link
    rel="stylesheet"
    href="style.css"
  >
</head>


<body>

  <a
    class="skip"
    href="#main"
  >
    Skip to collection
  </a>


  <!-- HEADER -->

  <header>

    <button
      id="archive-button"
      aria-label="Open Fallen Angel Collections"
    >
      FALLEN ANGEL COLLECTIONS
    </button>


    <a
      href="#"
      class="brand"
      aria-label="NO SAINTS SOCIETY home"
    >

      <img
        id="logo"
        src="nosaintssocietylogo.png"
        alt="NO SAINTS SOCIETY"
        hidden
      >

      <span id="wordmark">
        NO SAINTS
        <br>
        SOCIETY
      </span>

    </a>


    <button
      id="bag-button"
      aria-label="Open shopping bag"
    >

      <svg
        width="24"
        height="27"
        viewBox="0 0 24 27"
        fill="none"
        aria-hidden="true"
      >

        <path
          d="M5 8h14l1 16H4L5 8Z M8 9V6a4 4 0 0 1 8 0v3"
          stroke="currentColor"
          stroke-width="1.2"
        />

      </svg>

      <span id="bag-count">
        0
      </span>

    </button>

  </header>


  <!-- MAIN STORE -->

  <main
    id="main"
    tabindex="-1"
  >

    <p class="loading">
      Loading collection…
    </p>

  </main>


  <!-- FOOTER -->

  <footer>

    <span class="footer-brand">
      NO SAINTS SOCIETY
    </span>


    <nav
      class="footer-links"
      aria-label="Customer information"
    >

      <button
        type="button"
        id="contact-button"
      >
        CONTACT
      </button>


      <button
        type="button"
        id="terms-button"
      >
        TERMS
      </button>


      <button
        type="button"
        id="order-status-button"
      >
        ORDER STATUS
      </button>

    </nav>


    <span id="demo-label">
    </span>

  </footer>


  <!-- FULL PAGE OVERLAY -->

  <dialog
    id="layer"
    aria-labelledby="layer-title"
  >

    <div class="layer-top">

      <h2 id="layer-title">
      </h2>


      <button
        id="close-layer"
        aria-label="Close full-page view"
      >

        CLOSE

        <span aria-hidden="true">
          ×
        </span>

      </button>

    </div>


    <div id="layer-content">
    </div>

  </dialog>


  <!-- NOTIFICATIONS -->

  <div
    id="notice"
    role="status"
    aria-live="polite"
  >
  </div>


  <noscript>
    This storefront requires JavaScript to show products and your bag.
  </noscript>


  <script
    type="module"
    src="app.js"
  >
  </script>

</body>

</html>
